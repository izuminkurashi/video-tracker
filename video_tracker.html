<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画編集 タイムトラッカー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F5F0; --surface: #fff; --surface2: #F0EDE8; --surface3: #E8E4DC;
  --border: #E2DED7; --border2: #C8C3BB;
  --text: #1A1816; --text2: #6B6560; --text3: #9E9892;
  --accent: #2C5F8A; --accent-light: #E4EEF6;
  --green: #1D7A5F; --green-light: #E5F3EF; --green-border: #9DD4C4;
  --orange: #C0541A; --orange-light: #FAF0E8;
  --mono: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif; --sans: 'Noto Sans JP', sans-serif;
  --r: 8px; --rl: 12px;
}
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

/* ── Top bar ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center;
  height: 52px; position: sticky; top: 0; z-index: 200; gap: 16px;
}
.logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .06em; font-weight: 500; flex-shrink: 0; }
.mode-tabs { display: flex; gap: 2px; margin-left: auto; }
.mode-tab { font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: var(--r); cursor: pointer; color: var(--text2); border: none; background: transparent; transition: all .15s; font-family: var(--sans); }
.mode-tab:hover { background: var(--surface2); color: var(--text); }
.mode-tab.active { background: var(--accent); color: #fff; }

/* ── Pages ── */
.page { display: none; max-width: 820px; margin: 0 auto; padding: 28px 20px; }
.page.active { display: block; }
.log-page { max-width: 980px; }

/* ── Project switcher card ── */
.switcher-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--rl); padding: 16px 20px; margin-bottom: 16px;
}
.switcher-top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.switcher-label {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text3); white-space: nowrap;
}
.proj-select {
  flex: 1; min-width: 160px; font-family: var(--sans); font-size: 14px;
  font-weight: 600; color: var(--text); background: var(--surface2);
  border: 1px solid var(--border2); border-radius: var(--r);
  padding: 7px 10px; outline: none; cursor: pointer; transition: border .15s;
}
.proj-select:focus { border-color: var(--accent); }
.btn-add-proj {
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  padding: 7px 14px; border-radius: var(--r);
  border: 1px dashed var(--border2); background: transparent;
  cursor: pointer; color: var(--text2); transition: all .15s; white-space: nowrap;
}
.btn-add-proj:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.btn-del-proj {
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  padding: 7px 12px; border-radius: var(--r);
  border: 1px solid var(--border); background: transparent;
  cursor: pointer; color: var(--text3); transition: all .15s; white-space: nowrap;
}
.btn-del-proj:hover { border-color: #E0B898; color: var(--orange); background: var(--orange-light); }

/* project title input row */
.proj-title-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.proj-title-lbl { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--text3); margin-bottom: 5px; }
.proj-title-input {
  font-family: var(--sans); font-size: 17px; font-weight: 600;
  color: var(--text); background: transparent; border: none; outline: none; width: 100%;
}
.proj-title-input::placeholder { color: var(--text3); font-weight: 400; font-size: 15px; }
.proj-meta { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
.proj-meta-item { font-size: 12px; color: var(--text2); }
.proj-meta-item strong { font-family: var(--mono); font-weight: 500; color: var(--text); font-size: 12px; margin-left: 4px; }

/* ── Duration field ── */
.duration-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.duration-lbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); white-space: nowrap; }
.duration-btns { display: flex; gap: 4px; }
.dur-btn { font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; cursor: pointer; color: var(--text2); transition: all .15s; }
.dur-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.dur-btn.selected.short { background: #E5F3EF; border-color: #9DD4C4; color: var(--green); }
.dur-btn.selected.long  { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.dur-btn.selected.yt    { background: #FBF4E5; border-color: #DEBB7A; color: #7A5200; }
.dur-btn.selected.short-v { background: #E5F3EF; border-color: #9DD4C4; color: var(--green); }
.dur-text { font-family: var(--sans); font-size: 12px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 4px 10px; outline: none; width: 140px; transition: border .15s; }
.dur-text:focus { border-color: var(--accent); }
.dur-text::placeholder { color: var(--text3); }
.dur-badge.short { background: #E5F3EF; color: var(--green); border: 1px solid #9DD4C4; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
.dur-badge.long  { background: var(--accent-light); color: var(--accent); border: 1px solid #A8C6E0; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
.dur-badge.short-v { background: #E5F3EF; color: var(--green); border: 1px solid #9DD4C4; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
.dur-badge.yt    { background: #FBF4E5; color: #7A5200; border: 1px solid #DEBB7A; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }

/* ── Project list (all projects overview) ── */
.all-proj-bar {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
}
.proj-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--text2); cursor: pointer;
  transition: all .15s;
}
.proj-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.proj-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.proj-chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: none; animation: p 1.4s ease-in-out infinite; }
.proj-chip.running .chip-dot { display: block; }
.proj-chip .chip-time { font-family: var(--mono); font-size: 11px; color: var(--text3); }

/* ── Total bar ── */
.total-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--rl); padding: 14px 20px; margin-bottom: 16px;
  gap: 12px; flex-wrap: wrap;
}
.total-lbl { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
.total-time { font-family: var(--mono); font-size: 32px; font-weight: 500; color: var(--text); }
.running-pill { display: none; align-items: center; gap: 7px; background: var(--green-light); border: 1px solid var(--green-border); color: var(--green); font-size: 12px; padding: 6px 14px; border-radius: 20px; }
.running-pill.on { display: flex; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: p 1.4s ease-in-out infinite; }
@keyframes p { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.7);opacity:.5} }

/* ── Controls ── */
.ctrl-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.btn { font-family: var(--sans); font-size: 13px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--border2); background: var(--surface); cursor: pointer; color: var(--text2); transition: all .15s; font-weight: 500; }
.btn:hover { background: var(--surface2); color: var(--text); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 14px; padding: 9px 18px; }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--orange); border-color: #E0B898; }
.btn.danger:hover { background: var(--orange-light); }

/* ── Sections ── */
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); margin-bottom: 9px; overflow: hidden; }
.sec-head { display: flex; align-items: center; padding: 12px 14px; cursor: pointer; gap: 9px; user-select: none; transition: background .12s; }
.sec-head:hover { background: var(--surface2); }
.sec-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sec-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
.sec-badge { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--text3); background: var(--surface2); }
.sec-time { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); min-width: 76px; text-align: right; }
.sec-arrow { font-size: 10px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
.sec-arrow.open { transform: rotate(90deg); }
.sec-body { border-top: 1px solid var(--border); }
.sec-body.collapsed { display: none; }

/* ── Item rows ── */
.item-row { display: flex; align-items: center; padding: 9px 12px 9px 34px; border-bottom: 1px solid var(--border); gap: 8px; transition: background .1s; flex-wrap: wrap; }
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: #FAFAF8; }
.item-name { flex: 1; font-size: 13px; color: var(--text); min-width: 100px; }
.item-timer { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); min-width: 76px; text-align: right; cursor: pointer; border-radius: 4px; padding: 1px 5px; transition: background .15s; }
.item-timer:hover { background: var(--surface2); }
.item-timer.running { color: var(--green); pointer-events: none; }
.btn-rst { font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text3); font-family: var(--sans); transition: all .12s; }
.btn-rst:hover { border-color: var(--border2); color: var(--text2); background: var(--surface2); }
.btn-start { font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; cursor: pointer; color: var(--text2); font-weight: 500; transition: all .12s; white-space: nowrap; font-family: var(--sans); min-width: 76px; text-align: center; }
.btn-start:hover { background: var(--surface2); color: var(--text); }
.btn-start.active { background: var(--green-light); border-color: var(--green-border); color: var(--green); }

/* ── Manual input ── */
.time-input-wrap { display: none; align-items: center; gap: 4px; }
.time-input-wrap.open { display: flex; }
.time-input-wrap input { font-family: var(--mono); font-size: 13px; width: 40px; text-align: center; padding: 3px 4px; border: 1px solid var(--border2); border-radius: 4px; background: var(--surface); color: var(--text); outline: none; }
.time-input-wrap input:focus { border-color: var(--accent); }
.time-input-wrap .lbl { font-size: 11px; color: var(--text3); }
.btn-apply { font-size: 11px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--green-border); background: var(--green-light); cursor: pointer; color: var(--green); font-family: var(--sans); font-weight: 500; white-space: nowrap; }
.btn-cancel-edit { font-size: 11px; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text3); font-family: var(--sans); }
.btn-cancel-edit:hover { background: var(--surface2); }

/* ── Log page ── */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 22px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); padding: 13px 16px; }
.stat-lbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.stat-val { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--text); }
.log-ctrl { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.empty { text-align: center; padding: 70px 20px; color: var(--text2); }
.empty-icon { font-size: 36px; opacity: .45; margin-bottom: 14px; }
.empty h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty p { font-size: 13px; line-height: 1.7; }
.log-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); margin-bottom: 10px; overflow: hidden; }
.log-head { padding: 12px 16px; cursor: pointer; transition: background .12s; }
.log-head:hover { background: var(--surface2); }
.log-row { display: grid; grid-template-columns: 26px 1fr 90px 160px 160px 78px 20px; align-items: center; gap: 0 8px; }
.log-row + .log-row { margin-top: 5px; }
.log-num { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.log-title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-total { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--accent); text-align: right; }
.log-arr { font-size: 10px; color: var(--text3); transition: transform .2s; text-align: right; }
.log-arr.open { transform: rotate(90deg); }
.log-cell { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: visible; }
.log-cell strong { font-weight: 500; color: var(--text2); }
.log-detail { display: none; border-top: 1px solid var(--border); padding: 16px; }
.log-detail.open { display: block; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 9px; margin-bottom: 14px; }
.ds { background: var(--surface2); border-radius: var(--r); padding: 11px 13px; }
.ds-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ds-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ds-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
.ds-time { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); }
.ds-item { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); padding: 2px 0; }
.ds-item span { font-family: var(--mono); font-weight: 500; color: var(--text); font-size: 12px; }
.bar-section { padding-top: 14px; border-top: 1px solid var(--border); }
.bar-ttl { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.bar-lbl { font-size: 12px; color: var(--text2); min-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-pct { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 34px; text-align: right; }
.det-foot { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; font-size: 13px; font-weight: 500;
  padding: 10px 20px; border-radius: 20px; pointer-events: none;
  opacity: 0; transition: opacity .3s; white-space: nowrap; z-index: 9999;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="logo">VID / TRACKER</span>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('tracker',this)">タイマー</button>
    <button class="mode-tab" onclick="switchMode('log',this)">記録一覧</button>
  </div>
</div>

<!-- TRACKER page -->
<div class="page active" id="page-tracker">

  <!-- Project switcher -->
  <div class="switcher-card">
    <div class="switcher-top">
      <span class="switcher-label">編集中の動画</span>
      <button class="btn-add-proj" onclick="addProject()">＋ 新しい動画</button>
      <button class="btn-del-proj" onclick="deleteProject()" title="この動画を削除">削除</button>
    </div>
    <div class="proj-title-row">
      <div class="proj-title-lbl">クライアント名</div>
      <input class="proj-title-input" id="proj-client-input" type="text"
        placeholder="クライアント名を入力してください..." maxlength="80"
        oninput="onClientInput(this.value)"
        style="font-size:14px;font-weight:500;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
      <div class="proj-title-lbl" style="margin-top:2px">タイトル</div>
      <input class="proj-title-input" id="proj-title-input" type="text"
        placeholder="動画のタイトルを入力してください..." maxlength="120"
        oninput="onTitleInput(this.value)">
      <div class="proj-meta">
        <div class="proj-meta-item">作業開始日：<input type="text" id="meta-date-input"
          style="font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text);background:transparent;border:none;outline:none;width:130px;cursor:text;"
          placeholder="yyyy/mm/dd"
          oninput="onSessionDateInput(this.value)"></div>
      </div>
      <div class="duration-row">
        <div class="duration-btns">
          <button class="dur-btn short-v" id="dur-fmt-short" onclick="setDurFmt('short')">ショート</button>
          <button class="dur-btn yt"      id="dur-fmt-yt"    onclick="setDurFmt('yt')">長尺</button>
        </div>
        <span class="duration-lbl" style="margin-left:10px">素材尺</span>
        <input class="dur-text" id="dur-raw-text" type="text" placeholder="10分、01:30:00" maxlength="20" oninput="onDurTextInput('raw',this.value)">
        <span class="duration-lbl" style="margin-left:6px">完成尺</span>
        <input class="dur-text" id="dur-fin-text" type="text" placeholder="90秒、00:03:00" maxlength="20" oninput="onDurTextInput('fin',this.value)">
      </div>
    </div>
  </div>

  <!-- All projects overview chips -->
  <div class="all-proj-bar" id="proj-chips"></div>

  <!-- Total -->
  <div class="total-bar">
    <div>
      <div class="total-lbl">この動画の合計作業時間</div>
      <div class="total-time" id="total-disp">0:00:00</div>
    </div>
    <div class="running-pill" id="run-pill">
      <div class="pulse"></div><span id="run-lbl">計測中...</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrl-row">
    <button class="btn" onclick="stopCurrentTimer()">⏸ 一時停止</button>
    <button class="btn danger" onclick="confirmReset()">↺ リセット</button>
    <button class="btn" onclick="deliverProject()" style="border-color:#9DD4C4;color:var(--green)">✅ 納品完了</button>
    <button class="btn primary" onclick="saveLog()">💾 ログに保存</button>
    <button class="btn danger" onclick="clearAllProjects()">全削除</button>
  </div>

  <!-- Sections -->
  <div id="sections"></div>
</div>

<!-- LOG page -->
<div class="page log-page" id="page-log">
  <div class="stats-row" id="stats-row"></div>
  <div class="log-ctrl">
    <button class="btn" onclick="exportCSV()">↓ CSV書き出し</button>
    <button class="btn" onclick="exportCurrentState()" title="保存前の現在の計測データをCSVで書き出す">↓ 計測中データを書き出し</button>
    <button class="btn" onclick="document.getElementById('csv-import-input').click()">↑ CSVから読み込む</button>
    <input type="file" id="csv-import-input" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button class="btn danger" onclick="clearAllLogs()">全削除</button>
  </div>
  <div id="log-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── SECTION DEFINITIONS ─────────────────────────────────────────
const COLORS = {
  prep:'#378ADD', design:'#1D9E75', cut:'#D85A30',
  telop:'#BA7517', audio:'#7F77DD', visual:'#D4537E', check:'#888780', thumb:'#8E44AD', fb:'#A03562',
};
const SECTION_DEFS = [
  { id:'prep',   label:'準備', badge:'準備',
    items:[
      { id:'prep_file',  name:'プロジェクトファイル作成・設定' },
      { id:'cut_check',  name:'素材確認' },
    ]},
  { id:'design', label:'デザイン', badge:'デザイン',
    items:[{ id:'design_main', name:'デザイン作成' }] },
  { id:'cut',    label:'カット編集', badge:'カット',
    items:[
      { id:'cut_rough', name:'荒カット' },
      { id:'cut_fine',  name:'不要尺をカット' },
    ]},
  { id:'telop',  label:'テロップ', badge:'テロップ',
    items:[
      { id:'tel_trans',  name:'文字起こし' },

  { id:'audio',  label:'SE・BGM', badge:'音声',
    items:[
      { id:'audio_se',  name:'SE（効果音）挿入・調整' },
      { id:'audio_bgm', name:'BGM選定・挿入' },
      { id:'audio_vol', name:'音量バランス調整' },
    ]},
  { id:'visual', label:'画面・映像調整', badge:'映像',
    items:[
      { id:'vis_screen', name:'画角調整' },
      { id:'vis_img',    name:'画像・素材挿入' },
      { id:'vis_color',  name:'色調補正' },
    ]},
  { id:'check',  label:'最終チェック', badge:'仕上げ',
    items:[
      { id:'chk_digest', name:'ダイジェスト作成' },
      { id:'chk_fix',    name:'確認・修正対応' },
      { id:'chk_exp',    name:'書き出し・提出' },
    ]},
  { id:'thumb',  label:'サムネイル制作', badge:'サムネイル',
    items:[
      { id:'thumb_design', name:'サムネイルデザイン作成' },
      { id:'thumb_exp',    name:'書き出し・提出' },
    ]},
  { id:'fb',     label:'FB対応', badge:'修正',
    items:[
      { id:'fb_fix', name:'確認・修正対応' },
      { id:'fb_exp', name:'最終書き出し' },
    ]},
];
const ALL_ITEM_IDS = SECTION_DEFS.flatMap(s => s.items.map(i => i.id));

// ─── STATE ───────────────────────────────────────────────────────
let projects   = [];   // [{ pid, title, sessionDate, runningId, state }]
let activePid  = null;
let ticker     = null;

function newProj(title='') {
  const pid = Date.now() + '_' + Math.floor(Math.random()*9999);
  const st  = {};
  ALL_ITEM_IDS.forEach(id => { st[id] = { elapsed:0, startedAt:null }; });
  return { pid, title, clientName:'', fmtType:'', rawDurText:'', finDurText:'', sessionDate: new Date(), runningId:null, logId:null, state:st };
}
const getProj  = pid  => projects.find(p => p.pid === pid);
const activeP  = ()   => getProj(activePid);

// ─── HELPERS ─────────────────────────────────────────────────────
const fmt   = s => { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const fmtDt   = d => d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtDate = d => d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function elapsedOf(proj, id) {
  const s = proj.state[id]; if (!s) return 0;
  return s.elapsed + (s.startedAt ? Math.floor((Date.now()-s.startedAt)/1000) : 0);
}
function secTotalOf(proj, sec) { return sec.items.reduce((a,i) => a + elapsedOf(proj,i.id), 0); }
function grandTotalOf(proj)    { return SECTION_DEFS.reduce((a,s) => a + secTotalOf(proj,s), 0); }

// ─── PROJECT OPS ─────────────────────────────────────────────────
function addProject() {
  const proj = newProj();
  projects.push(proj);
  activePid = proj.pid;
  refreshSelectAndChips();
  renderTrackerPage();
  autosave();
  document.getElementById('proj-title-input').focus();
}

function deleteProject() {
  if (projects.length <= 1) { showToast('動画は最低1つ必要です'); return; }
  const proj = activeP();
  const msg  = grandTotalOf(proj) > 0
    ? `「${proj.title||'無題'}」を削除しますか？\n保存していない時間データは消えます。`
    : `「${proj.title||'無題'}」を削除しますか？`;
  if (!confirm(msg)) return;
  if (proj.runningId) stopTimer(proj);
  projects = projects.filter(p => p.pid !== proj.pid);
  activePid = projects[projects.length-1].pid;
  refreshSelectAndChips();
  renderTrackerPage();
  autosave();
}

function switchProject(pid) {
  // stop current timer when switching
  const cur = activeP();
  if (cur && cur.runningId) stopTimer(cur);
  activePid = pid;
  refreshSelectAndChips();
  renderTrackerPage();
}

// ─── TIMER OPS ───────────────────────────────────────────────────
function startItem(itemId, itemName) {
  const proj = activeP(); if (!proj) return;
  if (proj.runningId === itemId) { stopTimer(proj); return; }
  stopTimer(proj);
  proj.state[itemId].startedAt = Date.now();
  proj.runningId = itemId;
  updateRunningPill(proj);
  startTicker();
  renderTimers();
  refreshSelectAndChips();
  autosave();
}

function stopTimer(proj) {
  if (!proj || !proj.runningId) return;
  const s = proj.state[proj.runningId];
  if (s && s.startedAt) {
    s.elapsed += Math.floor((Date.now()-s.startedAt)/1000);
    s.startedAt = null;
  }
  proj.runningId = null;
  if (proj.pid === activePid) {
    updateRunningPill(proj);
    renderTimers();
  }
  refreshSelectAndChips();
  autosave();
}

function stopCurrentTimer() { stopTimer(activeP()); renderTimers(); }

function startTicker() {
  if (ticker) return;
  ticker = setInterval(() => {
    const anyRunning = projects.some(p => p.runningId);
    if (!anyRunning) { clearInterval(ticker); ticker = null; return; }
    // render active proj
    const proj = activeP();
    if (proj && proj.runningId) renderTimers();
    // refresh chip times
    refreshChipTimes();
  }, 1000);
}

// ─── RENDER ──────────────────────────────────────────────────────
function renderTrackerPage() {
  const proj = activeP(); if (!proj) return;
  document.getElementById('proj-client-input').value = proj.clientName || '';
  document.getElementById('proj-title-input').value  = proj.title || '';
  document.getElementById('meta-date-input').value   = proj.sessionDate ? fmtDate(new Date(proj.sessionDate)) : '';
  // duration
  document.getElementById('dur-fin-text').value = proj.finDurText || '';
  document.getElementById('dur-raw-text').value = proj.rawDurText || '';
  ['short','yt'].forEach(t =>
    document.getElementById('dur-fmt-'+t).classList.toggle('selected', proj.fmtType===t));
  updateRunningPill(proj);
  renderTimers();
}

// ─── DURATION ────────────────────────────────────────────────────
function setDurFmt(type) {
  const proj = activeP(); if (!proj) return;
  proj.fmtType = proj.fmtType===type ? '' : type;
  ['short','yt'].forEach(t =>
    document.getElementById('dur-fmt-'+t).classList.toggle('selected', proj.fmtType===t));
  autosave();
}
function onDurTextInput(kind, val) {
  const proj = activeP(); if (!proj) return;
  if (kind==='raw') proj.rawDurText = val;
  else              proj.finDurText = val;
  autosave();
}

function deliverProject() {
  const proj = activeP(); if (!proj) return;
  const title = proj.title.trim() || '（タイトルなし）';
  const total = grandTotalOf(proj);

  let msg = `「${title}」を納品完了としてタイマーから削除します。`;
  if (total > 0) msg += `\n合計 ${fmt(total)} をログに保存してから削除します。`;
  else msg += `\n（計測データなし）`;
  msg += `\n\nよろしいですか？`;
  if (!confirm(msg)) return;

  stopTimer(proj);

  // 計測データがあれば常に最新で保存（新規 or 上書き）
  if (total > 0) {
    const isUpdate = proj.logId !== null && getLogs().some(l => l.id === proj.logId);
    const logId = isUpdate ? proj.logId : Date.now();
    const entry = {
      id: logId, title,
      clientName: proj.clientName || '',
      fmtType: proj.fmtType || '',
      rawDurText: proj.rawDurText || '', finDurText: proj.finDurText || '',
      dateStr: proj.sessionDate ? fmtDt(new Date(proj.sessionDate)) : fmtDt(new Date()),
      savedAt: fmtDt(new Date()), total,
      sections: SECTION_DEFS.map(s => ({
        id: s.id, label: s.label, time: secTotalOf(proj, s),
        items: s.items.map(i => ({ name: i.name, time: elapsedOf(proj, i.id) })),
      })),
    };
    let logs = getLogs();
    if (isUpdate) logs = logs.map(l => l.id === logId ? entry : l);
    else logs.push(entry);
    saveLogs(logs);
  }

  // タイマーから削除
  projects = projects.filter(p => p.pid !== proj.pid);
  if (projects.length > 0) {
    activePid = projects[projects.length - 1].pid;
  } else {
    const newP = newProj();
    newP.title = '';
    projects.push(newP);
    activePid = newP.pid;
  }

  refreshSelectAndChips();
  renderTrackerPage();
  autosave();
  showToast(`「${title}」を納品完了しました ✓`);
}

function renderTimers() {
  const proj = activeP(); if (!proj) return;
  const gt = grandTotalOf(proj);
  document.getElementById('total-disp').textContent = fmt(gt);

  ALL_ITEM_IDS.forEach(id => {
    const te = document.getElementById('it_'+id);
    const bt = document.getElementById('ib_'+id);
    if (!te) return;
    const running = proj.runningId === id;
    te.textContent = fmt(elapsedOf(proj, id));
    te.className   = 'item-timer' + (running ? ' running' : '');
    if (bt) { bt.textContent = running ? '⏹ 停止' : '▶ 開始'; bt.className = 'btn-start'+(running?' active':''); }
  });

  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('st_'+s.id); if (el) el.textContent = fmt(secTotalOf(proj, s));
  });
}

function updateRunningPill(proj) {
  const pill = document.getElementById('run-pill');
  const lbl  = document.getElementById('run-lbl');
  if (!proj || !proj.runningId) { pill.classList.remove('on'); return; }
  const item = SECTION_DEFS.flatMap(s=>s.items).find(i=>i.id===proj.runningId);
  lbl.textContent = `計測中：${item ? item.name : ''}`;
  pill.classList.add('on');
}

// ─── SELECT + CHIPS ──────────────────────────────────────────────
function refreshSelectAndChips() {
  const bar = document.getElementById('proj-chips');
  bar.innerHTML = '';
  const visible = projects.filter(p => p.title.trim());
  if (visible.length <= 1) return;
  visible.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'proj-chip' + (p.pid===activePid?' active':'') + (p.runningId?' running':'');
    chip.onclick = () => switchProject(p.pid);
    chip.innerHTML = `<span class="chip-dot"></span><span>${esc(p.title.trim())}</span><span class="chip-time">${fmt(grandTotalOf(p))}</span>`;
    bar.appendChild(chip);
  });
}

function refreshChipTimes() {
  const chips = document.querySelectorAll('.proj-chip');
  chips.forEach((chip, i) => {
    if (!projects[i]) return;
    const t = chip.querySelector('.chip-time');
    if (t) t.textContent = fmt(grandTotalOf(projects[i]));
  });
}

// ─── TITLE / CLIENT INPUT ────────────────────────────────────────
function onTitleInput(val) {
  const proj = activeP(); if (!proj) return;
  proj.title = val;
  refreshSelectAndChips();
  autosave();
}
function onClientInput(val) {

}

// ─── MANUAL EDIT ─────────────────────────────────────────────────
function openEdit(id) {
  const proj = activeP(); if (!proj) return;
  // 計測中（startedAt がある）場合のみブロック
  if (proj.state[id] && proj.state[id].startedAt) return;
  const sec = elapsedOf(proj, id);
  document.getElementById('eh_'+id).value = Math.floor(sec/3600)||'';
  document.getElementById('em_'+id).value = Math.floor((sec%3600)/60)||'';
  document.getElementById('es_'+id).value = sec%60||'';
  document.getElementById('it_'+id).style.display = 'none';
  document.getElementById('ei_'+id).classList.add('open');
  document.getElementById('ib_'+id).style.display = 'none';
  document.getElementById('eh_'+id).focus();
}
function closeEdit(id) {
  document.getElementById('ei_'+id).classList.remove('open');
  document.getElementById('it_'+id).style.display = '';
  document.getElementById('ib_'+id).style.display = '';
}
function applyEdit(id) {
  const proj = activeP(); if (!proj) return;
  const h=parseInt(document.getElementById('eh_'+id).value)||0;
  const m=parseInt(document.getElementById('em_'+id).value)||0;
  const s=parseInt(document.getElementById('es_'+id).value)||0;
  proj.state[id].elapsed = h*3600+m*60+s;
  proj.state[id].startedAt = null;
  closeEdit(id); renderTimers(); autosave();
}

function resetItem(id) {
  const proj = activeP(); if (!proj) return;
  if (proj.runningId===id) stopTimer(proj);
  proj.state[id].elapsed = 0; proj.state[id].startedAt = null;
  renderTimers();
}

function clearAllProjects() {
  if (!confirm('タイマーの案件をすべて削除しますか？\nログ保存済みの記録一覧は消えません。\n\nこの操作は元に戻せません。')) return;
  projects.forEach(p => { if (p.runningId) stopTimer(p); });
  projects = [newProj()];
  activePid = projects[0].pid;
  refreshSelectAndChips();
  renderTrackerPage();
  localStorage.removeItem('vidSnap');
  showToast('タイマーをすべて削除しました');
}

function confirmReset() {
  if (!confirm('この動画のタイマーをすべてリセットしますか？\nログ保存済みの記録は消えません。')) return;
  const proj = activeP(); if (!proj) return;
  stopTimer(proj);
  ALL_ITEM_IDS.forEach(id => { proj.state[id]={elapsed:0,startedAt:null}; });
  proj.sessionDate = new Date(); proj.title = '';
  document.getElementById('proj-title-input').value = '';
  document.getElementById('meta-date-input').value = fmtDate(proj.sessionDate);
  refreshSelectAndChips(); renderTimers(); autosave();
}

function toggleSec(id) {

}

// ─── SAVE LOG ────────────────────────────────────────────────────
function saveLog() {
  const proj = activeP(); if (!proj) return;
  if (snapTimer) { clearTimeout(snapTimer); snapTimer = null; }

  const title = proj.title.trim() || '（タイトルなし）';
  const total = grandTotalOf(proj);
  if (total === 0) { showToast('まだ計測されていません'); return; }

  // すでに保存済みなら上書き確認、初回なら保存確認
  const isUpdate = proj.logId !== null && getLogs().some(l => l.id === proj.logId);
  const msg = isUpdate
    ? `「${title}」の記録を上書き保存しますか？\n合計：${fmt(total)}`
    : `「${title}」の記録を保存しますか？\n合計：${fmt(total)}`;
  if (!confirm(msg)) return;

  stopTimer(proj);

  const logId = isUpdate ? proj.logId : Date.now();
  const entry = {
    id: logId, title,
    clientName: proj.clientName || '',
    fmtType: proj.fmtType || '',
    rawDurText: proj.rawDurText || '', finDurText: proj.finDurText || '',
    dateStr: proj.sessionDate ? fmtDt(new Date(proj.sessionDate)) : fmtDt(new Date()),
    savedAt: fmtDt(new Date()),
    total,
    sections: SECTION_DEFS.map(s => ({
      id: s.id, label: s.label, time: secTotalOf(proj, s),
      items: s.items.map(i => ({ name: i.name, time: elapsedOf(proj, i.id) })),
    })),
  };

  let logs = getLogs();
  if (isUpdate) {
    // 上書き：同じidのものを置き換え
    logs = logs.map(l => l.id === logId ? entry : l);
  } else {
    logs.push(entry);
  }
  saveLogs(logs);

  // logIdを記憶（次回から上書き）
  proj.logId = logId;

  showToast(isUpdate ? '上書き保存しました ✓' : 'ログに保存しました ✓');

  // タイマーはリセットせず、autosaveのみ実行
  const snap = projects.map(p => ({
    pid: p.pid, title: p.title, clientName: p.clientName || '',
    fmtType: p.fmtType || '', rawDurText: p.rawDurText || '', finDurText: p.finDurText || '',
    sessionDate: p.sessionDate ? (p.sessionDate instanceof Date ? p.sessionDate.toISOString() : p.sessionDate) : null,
    logId: p.logId || null,
    runningId: null,
    state: Object.fromEntries(Object.entries(p.state).map(([k, v]) => [k, { elapsed: elapsedOf(p, k) }])),
  }));
  localStorage.setItem('vidSnap', JSON.stringify({ projects: snap, activePid }));
}

// ─── PERSIST ─────────────────────────────────────────────────────
let snapTimer=null;
function autosave() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(()=>{
    const snap = projects.map(p=>({
      pid:p.pid, title:p.title, clientName:p.clientName||'',
      fmtType:p.fmtType||'',
      rawDurText:p.rawDurText||'', finDurText:p.finDurText||'',
      sessionDate: p.sessionDate ? (p.sessionDate instanceof Date ? p.sessionDate.toISOString() : p.sessionDate) : null,
      logId: p.logId || null,
      runningId:null,
      state:Object.fromEntries(Object.entries(p.state).map(([k,v])=>[k,{elapsed:elapsedOf(p,k)}])),
    }));
    localStorage.setItem('vidSnap', JSON.stringify({projects:snap, activePid}));
  },1500);
}

function loadSnap() {
  try {
    const raw = JSON.parse(localStorage.getItem('vidSnap')||'null');
    if (!raw||!raw.projects||!raw.projects.length) return false;
    raw.projects.forEach(snap=>{
      const p = newProj(snap.title||'');
      p.pid = snap.pid;
      p.clientName = snap.clientName || '';
      p.fmtType    = snap.fmtType    || '';
      p.rawDurText = snap.rawDurText || '';
      p.finDurText = snap.finDurText || '';
      p.sessionDate = snap.sessionDate ? new Date(snap.sessionDate) : null;
      p.logId = snap.logId || null;
      if (snap.state) Object.entries(snap.state).forEach(([k,v])=>{ if(p.state[k]) p.state[k].elapsed=v.elapsed||0; });
      projects.push(p);
    });
    activePid = raw.activePid && projects.find(p=>p.pid===raw.activePid) ? raw.activePid : projects[0].pid;
    return true;
  } catch(e){ return false; }
}

// ─── MODE SWITCH ─────────────────────────────────────────────────

// ─── LOG ─────────────────────────────────────────────────────────
function getLogs(){ try{ return JSON.parse(localStorage.getItem('vidLogs')||'[]'); }catch(e){ return []; } }
function saveLogs(l){ localStorage.setItem('vidLogs',JSON.stringify(l)); }

function renderLog() {
  const logs=getLogs(); renderStats(logs);
  const c=document.getElementById('log-list'); c.innerHTML='';
  if(!logs.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon">📂</div><h2>まだ記録がありません</h2><p>タイマータブで作業し「💾 ログに保存」を押すと<br>ここに記録が表示されます。</p></div>`;
    return;
  }
  logs.slice().reverse().forEach((log,ri)=>{
    const num=logs.length-ri;
    const card=document.createElement('div'); card.className='log-card';
    const grid=log.sections.map(s=>{
      const col=COLORS[s.id]||'#888';
      const items=s.items.filter(i=>i.time>0).map(i=>`<div class="ds-item">${i.name}<span>${fmt(i.time)}</span></div>`).join('')||'<div class="ds-item" style="color:var(--text3)">（記録なし）</div>';
      return `<div class="ds"><div class="ds-top"><div class="ds-dot" style="background:${col}"></div><span class="ds-name">${s.label}</span><span class="ds-time">${fmt(s.time)}</span></div>${items}</div>`;
    }).join('');
    const bars=log.sections.filter(s=>s.time>0).sort((a,b)=>b.time-a.time).map(s=>{
      const pct=log.total>0?Math.round(s.time/log.total*100):0;
      return `<div class="bar-row"><span class="bar-lbl">${s.label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${COLORS[s.id]||'#888'}"></div></div><span class="bar-pct">${pct}%</span></div>`;
    }).join('');
    const fmtLabel  = log.fmtType==='short'?'ショート':log.fmtType==='yt'?'長尺':'';
    const clientStr = log.clientName || '';
    const finText   = log.finDurText || '';
    const rawText   = log.rawDurText || '';

    const dateStr10 = log.dateStr ? log.dateStr.slice(0,10) : '—';

    card.innerHTML=`
      <div class="log-head" onclick="toggleDet(${log.id})">
        <div class="log-row">
          <span class="log-num">#${num}</span>
          <span class="log-title">${log.title}</span>
          <span></span>
          <span></span>
          <span class="log-cell">作業開始日：<strong>${dateStr10}</strong></span>
          <span class="log-total">${fmt(log.total)}</span>
          <span class="log-arr" id="la_${log.id}">▶</span>
        </div>
        <div class="log-row" style="margin-top:4px">
          <span></span>
          <span class="log-cell">${clientStr ? `クライアント：<strong style="overflow:hidden;text-overflow:ellipsis;max-width:200px;display:inline-block;vertical-align:bottom">${clientStr}</strong>` : '<span style="color:var(--border2)">—</span>'}</span>
          <span class="log-cell">${fmtLabel ? `<span class="dur-badge ${log.fmtType}">${fmtLabel}</span>` : '<span style="color:var(--border2)">—</span>'}</span>
          <span class="log-cell">${rawText ? `素材尺：<strong>${rawText}</strong>` : '<span style="color:var(--border2)">素材尺：—</span>'}</span>
          <span class="log-cell">${finText ? `完成尺：<strong>${finText}</strong>` : '<span style="color:var(--border2)">完成尺：—</span>'}</span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="log-detail" id="ld_${log.id}">
        <div class="detail-grid">${grid}</div>
        <div class="bar-section"><div class="bar-ttl">工程別割合</div>${bars}</div>
        <div class="det-foot">
          <button class="btn" onclick="exportOne(${log.id})">↓ CSV</button>
          <button class="btn danger" onclick="deleteLog(${log.id})">削除</button>
        </div>
      </div>`;
    c.appendChild(card);
  });
}

function renderStats(logs) {
  const c=document.getElementById('stats-row'); c.innerHTML='';
  if(!logs.length) return;
  const totalSec=logs.reduce((a,l)=>a+l.total,0);
  const avg=Math.round(totalSec/logs.length);
  const secMap={};
  logs.forEach(l=>l.sections.forEach(s=>{ secMap[s.label]=(secMap[s.label]||0)+s.time; }));
  const top=Object.entries(secMap).sort((a,b)=>b[1]-a[1])[0];
  c.innerHTML=`
    <div class="stat-card"><div class="stat-lbl">セッション数</div><div class="stat-val">${logs.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">総作業時間</div><div class="stat-val">${fmt(totalSec)}</div></div>
    <div class="stat-card"><div class="stat-lbl">平均時間</div><div class="stat-val">${fmt(avg)}</div></div>
    <div class="stat-card"><div class="stat-lbl">最多工程</div><div class="stat-val" style="font-size:13px;line-height:1.5">${top?top[0]:'—'}</div></div>`;
}

function toggleDet(id) {
  const d=document.getElementById('ld_'+id),a=document.getElementById('la_'+id);
  const open=d.classList.toggle('open');
  a.className='log-arr'+(open?' open':'');
}
function deleteLog(id) {
  if(!confirm('この記録を削除しますか？')) return;
  saveLogs(getLogs().filter(l=>l.id!==id)); renderLog();
}
function exportCurrentState() {
  if (!projects.length) { showToast('計測データがありません'); return; }
  const allNames = new Set();
  SECTION_DEFS.forEach(s => s.items.forEach(i => allNames.add(s.label+' / '+i.name)));
  const cols = [...allNames];
  const secLabels = SECTION_DEFS.map(s => s.label);
  const header = ['#','クライアント名','タイトル','形式','素材尺','完成尺','作業開始日','合計（秒）','合計時間',...secLabels.map(l=>l+'（秒）'),...cols.map(c=>c+'（秒）')];
  const e = v => { const s=String(v); return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:''+s; };
  const rows = projects.map((p,i) => {
    const fmtLabel = p.fmtType==='short'?'ショート':p.fmtType==='yt'?'長尺':'';
    const sc = SECTION_DEFS.map(sec => secTotalOf(p, sec));
    const ic = cols.map(col => { for(const s of SECTION_DEFS) for(const it of s.items) if(s.label+' / '+it.name===col) return elapsedOf(p,it.id); return 0; });
    return [i+1, p.clientName||'', p.title||'（未入力）', fmtLabel, p.rawDurText||'', p.finDurText||'', p.sessionDate?fmtDt(new Date(p.sessionDate)):'', grandTotalOf(p), fmt(grandTotalOf(p)), ...sc, ...ic];
  });
  const csv = '\uFEFF' + [header,...rows].map(r=>r.map(e).join(',')).join('\n');
  dl('current_timers.csv', csv);
}

// ─── CSV IMPORT ──────────────────────────────────────────────────
function importCSV(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let text = e.target.result.replace(/^\uFEFF/, '');
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { showToast('データが見つかりません'); return; }

      const parseRow = row => {
        const cells = []; let cur = ''; let inQ = false;
        for (let i = 0; i < row.length; i++) {
          const c = row[i];
          if (c === '"') {
            if (inQ && row[i+1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
          } else if (c === ',' && !inQ) { cells.push(cur); cur = ''; }
          else cur += c;
        }
        cells.push(cur); return cells;
      };

      const headers = parseRow(lines[0]);
      const idx = k => headers.indexOf(k);
      const isCurrentState = idx('保存日時') === -1;

      // 旧列名 → 新列名のマッピング
      const COL_MAP = {
        'プロジェクトファイル作成 / プロジェクトファイル作成・設定（秒）': '準備 / プロジェクトファイル作成・設定（秒）',
        'カット編集 / 素材確認（秒）':                                    '準備 / 素材確認（秒）',
        'デザイン・レイアウト / デザイン作成（秒）':                       'デザイン / デザイン作成（秒）',
        'カット編集 / 不要部分をカット（秒）':                             'カット編集 / 不要尺をカット（秒）',
        'カット編集 / カット（荒カット）（秒）':                           'カット編集 / 荒カット（秒）',
        'テロップ / テロップ設定（フォント・サイズ・プリセット）（秒）':    'テロップ / テロップ設定（秒）',
        '最終チェック / 通し確認（秒）':                                  '最終チェック / ダイジェスト作成（秒）',
        '最終チェック / 修正対応（秒）':                                  '最終チェック / 確認・修正対応（秒）',
        '最終チェック / 書き出し設定確認（秒）':                          '最終チェック / 書き出し・提出（秒）',
        '画面・映像調整 / 画面調整（構図・クロップ）（秒）':               '画面・映像調整 / 画角調整（秒）',
      };

      // 正規化したヘッダーを作る（旧→新に変換）
      const normHeaders = headers.map(h => COL_MAP[h] || h);
      const normIdx = k => normHeaders.indexOf(k);

      const entries = [];
      for (let i = 1; i < lines.length; i++) {
        const cells = parseRow(lines[i]);
        if (!cells.length || cells.every(c => !c.trim())) continue;

        const get  = k => { const j = idx(k);     return j >= 0 ? (cells[j]||'').trim() : ''; };
        const getn = k => { const j = normIdx(k); return j >= 0 ? (cells[j]||'').trim() : ''; };

        const title      = get('タイトル') || '（インポート）';
        const clientName = get('クライアント名') || '';
        const fmtLabel   = get('形式');
        const fmtType    = fmtLabel==='ショート' ? 'short' : fmtLabel==='長尺' ? 'yt' : '';
        const rawDurText = get('素材尺');
        const finDurText = get('完成尺');
        const dateStr    = get('作業開始日') || get('作業開始') || fmtDt(new Date());
        const savedAt    = isCurrentState ? fmtDt(new Date()) : (get('保存日時') || fmtDt(new Date()));

        // 現在のSECTION_DEFSに基づいて小項目から時間を取得
        const sections = SECTION_DEFS.map(s => {
          const items = s.items.map(item => {
            const col = s.label + ' / ' + item.name + '（秒）';
            const j = normIdx(col);
            const time = j >= 0 ? (parseInt(cells[j]) || 0) : 0;
            return { name: item.name, time };
          });
          const time = items.reduce((a, it) => a + it.time, 0);
          return { id: s.id, label: s.label, time, items };
        });

        const total = sections.reduce((a, s) => a + s.time, 0);
        if (total === 0) continue;

        entries.push({
          id: Date.now() + i,
          title, clientName, fmtType, rawDurText, finDurText,
          dateStr, savedAt, total, sections,
        });
      }

      if (!entries.length) { showToast('有効なデータがありませんでした'); input.value=''; return; }

      // 選択ダイアログ
      const choice = confirm(
        `${entries.length}件のデータを読み込みます。\n\n` +
        `【OK】ログ一覧のみに追加\n` +
        `【キャンセル】→ 次の画面でタイマーにも追加するか選べます`
      );

      const addToTimer = choice ? false : confirm(
        `タイマーにも追加しますか？\n\n` +
        `【OK】ログ一覧 ＋ タイマーの両方に追加\n` +
        `【キャンセル】追加しない（読み込みを中止）`
      );

      if (!choice && !addToTimer) { input.value=''; return; }

      // ログ一覧に追加
      const logs = getLogs();
      entries.forEach(entry => logs.push(entry));
      saveLogs(logs);

      // タイマーにも追加する場合
      if (addToTimer) {
        entries.forEach(entry => {
          const p = newProj(entry.title);
          p.clientName  = entry.clientName  || '';
          p.fmtType     = entry.fmtType     || '';
          p.rawDurText  = entry.rawDurText  || '';
          p.finDurText  = entry.finDurText  || '';
          p.sessionDate = entry.dateStr ? new Date(entry.dateStr) : new Date();
          p.logId       = entry.id;
          SECTION_DEFS.forEach(s => {
            const sec = entry.sections.find(es => es.id === s.id);
            if (!sec) return;
            s.items.forEach(item => {
              const it = sec.items.find(ei => ei.name === item.name);
              if (it && p.state[item.id]) p.state[item.id].elapsed = it.time || 0;
            });
          });
          projects.push(p);
        });
        activePid = projects[projects.length - 1].pid;
        refreshSelectAndChips();
        renderTrackerPage();
        autosave();
      }

      renderLog();
      showToast(`${entries.length}件をインポートしました ✓`);
    } catch(err) {
      showToast('読み込みに失敗しました');
      console.error(err);
    }
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function clearAllLogs() {
  if (!confirm('すべての記録を削除しますか？\nこの操作は元に戻せません。')) return;
  localStorage.removeItem('vidLogs'); renderLog();
}

// ─── CSV ─────────────────────────────────────────────────────────
function buildCSV(logs) {
  const allNames=new Set();
  logs.forEach(l=>l.sections.forEach(s=>s.items.forEach(i=>allNames.add(s.label+' / '+i.name))));
  const cols=[...allNames];
  const secLabels=SECTION_DEFS.map(s=>s.label);
  const header=['#','クライアント名','タイトル','形式','素材尺','完成尺','作業開始日','保存日時','合計（秒）','合計時間',...secLabels.map(l=>l+'（秒）'),...cols.map(c=>c+'（秒）')];
  const e=v=>{ const s=String(v); return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:''+s; };
  const rows=logs.map((l,i)=>{
    const fmtLabel = l.fmtType==='short'?'ショート':l.fmtType==='yt'?'長尺':'';
    const sc=SECTION_DEFS.map(ref=>{ const f=l.sections.find(s=>s.id===ref.id); return f?f.time:0; });
    const ic=cols.map(col=>{ for(const s of l.sections) for(const it of s.items) if(s.label+' / '+it.name===col) return it.time; return 0; });
    return [i+1,l.clientName||'',l.title,fmtLabel,l.rawDurText||'',l.finDurText||'',l.dateStr,l.savedAt||'',l.total,fmt(l.total),...sc,...ic];
  });
  return '\uFEFF'+[header,...rows].map(r=>r.map(e).join(',')).join('\n');
}
function dl(name,content){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8;'})); a.download=name; a.click(); }
function exportCSV(){ const logs=getLogs(); if(!logs.length){showToast('記録がありません');return;} dl('video_editing_log.csv',buildCSV(logs)); }
function exportOne(id){ const log=getLogs().find(l=>l.id===id); if(!log) return; dl(`log_${log.title.replace(/\s+/g,'_')||id}.csv`,buildCSV([log])); }

// ─── INIT ────────────────────────────────────────────────────────
buildSections();
if (!loadSnap()) addProject();
else { refreshSelectAndChips(); renderTrackerPage(); }
</script>
